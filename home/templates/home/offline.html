{% load static %}<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#112233">
    <title>Geen verbinding | BVA VSE-2</title>
    <style>
        body {
            margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; color: #ffffff; text-align: center;
            background: linear-gradient(120deg, #58A6C2 0%, #2f6f8c 45%, #112233 100%);
        }
        .kaart { max-width: 340px; padding: 32px 24px; }
        img { width: 96px; height: 96px; border-radius: 22px; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25); }
        h1 { font-size: 1.4rem; margin: 20px 0 8px; }
        p { opacity: 0.85; line-height: 1.5; margin: 0 0 24px; }
        button {
            background: #ffffff; color: #112233; border: 0; border-radius: 999px; padding: 12px 28px;
            font-weight: 700; font-size: 1rem; cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="kaart">
        <img src="{% static 'img/app/icon-192.png' %}" alt="BVA">
        <h1>Geen internetverbinding</h1>
        <p>Je bent offline. Zodra je weer verbinding hebt, kun je verder met opdrachten, plays en wedstrijden.</p>
        <button type="button" onclick="location.reload()">Opnieuw proberen</button>
    </div>
</body>
</html>
