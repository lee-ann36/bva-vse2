{% load static %}
<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}BVA VSE-2{% endblock %}</title>
    <meta name="csrf-token" content="{{ csrf_token }}">
    <meta name="push-sleutel" content="{{ push_publieke_sleutel }}">
    <link rel="manifest" href="/manifest.webmanifest">
    <meta name="theme-color" content="#112233">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="VSE-2">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="{% static 'img/app/apple-touch-icon.png' %}">
    <link rel="icon" type="image/png" sizes="32x32" href="{% static 'img/app/favicon-32.png' %}">
    <script src="{% static 'js/pwa.js' %}" defer></script>
    
    <!-- Bootstrap 5 & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    
    {% block extra_css %}{% endblock %}
</head>
<body style="background-color: #f4f6f8;" data-moderator="{% if is_moderator %}1{% else %}0{% endif %}">

    <!-- TOP NAVIGATIEBALK (Donkerblauw) -->
    <nav class="navbar navbar-expand-lg navbar-dark px-4 py-3" style="background-color: #0b172a;">
        <div class="container-fluid">
            <!-- Logo + Teamnaam (Klikbaar -> Terug naar Home) -->
            <a class="navbar-brand d-flex align-items-center gap-3" href="/">
                <img src="{% static 'img/bva-logo-wit.png' %}" alt="BVA logo" width="44" height="52" style="height: 52px; width: auto;">
                <div>
                    <div class="fw-bold lh-1">BVA VSE-2</div>
                    <small class="text-muted opacity-75 style-sub" style="font-size: 0.7rem;">AMSTERDAM</small>
                </div>
            </a>

            <!-- Menu items rechts -->
            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <ul class="navbar-nav align-items-center gap-3">
                    <li class="nav-item">
                        <a class="nav-link text-white opacity-75" href="/wedstrijden/">Wedstrijden</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-white opacity-75" href="/plays/">Plays</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-white opacity-75" href="/training/">Training</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-white opacity-75" href="/statistieken/">Stats</a>
                    </li>
                    <li class="nav-item">
                        <a class="btn btn-light rounded-pill px-4 fw-bold ms-2" style="font-size: 0.9rem;" href="/team/">Ons team</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- INHOUD VAN DE PAGINA -->
    {% block content %}
    {% endblock %}

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    {% block reacties_js %}{% endblock %}
    {% block extra_js %}{% endblock %}
</body>
</html>
